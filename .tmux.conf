# ----------------------------------------------------
# 1. 基本設定
# ----------------------------------------------------

# プレフィックスキーを C-a に変更
set -g prefix C-a
# デフォルトの C-b バインドを解除
unbind C-b
# C-a の重複押しで C-a を送信
bind C-a send-prefix

# マウス操作の有効化
set-option -g mouse on

# Neovim側でのフォーカス検知を有効にする (Yanky.nvim の同期に重要)
set -g focus-events on

# 上記の mouse on のため、リンクは Cmd + Shift + Click と、追加で Shift を押す必要がある
set -as terminal-features ",*:hyperlinks"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ----------------------------------------------------
# 2. キーバインド
# ----------------------------------------------------

# カスタムスクリプト
bind-key -n C-Space run-shell "$DOTFILES_DIR/bin/tmux-switcher.sh"

bind-key -n 'C-|' split-window -h -c "#{pane_current_path}" # 実際には C + \ で分割する挙動になる
bind-key -n 'C--' split-window -v -c "#{pane_current_path}"

# vim-tmux-navigator
# @see https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ----------------------------------------------------
# 3. hook
# ----------------------------------------------------

# 移動履歴系
set-hook -g after-rename-window { run-shell  "sed -i -E 's/#S:#{window_id}:.+$/#S:#{window_id}:#W/' $HOME/.dotfiles_tmux_history" }
set-hook -g after-new-window    {
    # ウィンドウの新規作成時に、履歴を追記する
    #W ではうまく初期ウィンドウ名が取れないため tmp をハードコード
    run-shell "$DOTFILES_DIR/bin/tmux-save-switch-history.sh #S:#{window_id}:tmp"
}

# ----------------------------------------------------
# 4. UI
# ----------------------------------------------------

# @see https://github.com/catppuccin/tmux/discussions/317#discussioncomment-11064512

# Configure Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

set -g status-interval 1

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_rosewater}]  #(tmux-list-fzf-options.sh | head -n1 | awk -F: '{print $1\":\"$3}') "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_maroon},fg=#{@thm_bg},bold]#{?window_zoomed_flag,  ,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?client_prefix,│,}"
set -ga status-left "#[fg=#{@thm_yellow},bg=#{@thm_bg},bold]#{?client_prefix, 󰌋 ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=default,fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# Load catppuccin
run $DOTFILES_DIR/submodules/catppuccin/tmux/catppuccin.tmux

# Configure Tmux
set -g status-position top
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
set -g pane-border-format "#[bg=default,fg=#{?pane_active,#{@thm_flamingo},#{@thm_overlay_2}}]#(cat /tmp/tmux_last_command#{pane_tty} 2>/dev/null | grep -v '^exit$')"
# ↓ refresh 前に一瞬 exit の文字がでるので、上記で grep -v することで対処。ctrl + x で pane を閉じるケースには対応できないが、普段使わないので一旦許容。
# set-hook -g after-split-window { run-shell "echo '' |> '/tmp/tmux_last_command#{pane_tty}'" }
setw -g pane-active-border-style "fg=#{@thm_flamingo}"
setw -g pane-border-style "fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "tmp" # after-new-window hook が参照

set -g window-status-format ""
set -g window-status-current-format "#[bg=#{@thm_bg},fg=#{@thm_peach},bold]  #S"
set -ga window-status-current-format "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none] │ "
set -ga window-status-current-format "#[bg=#{@thm_bg},fg=#{@thm_peach},bold] #W"

# popup
set -g popup-border-style "fg=#{@thm_overlay_0}"

